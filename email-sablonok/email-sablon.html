
<div style="margin:0;padding:0;background:#e4f3ef;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e4f3ef;padding:32px 12px;font-family:'Trebuchet MS','Segoe UI',-apple-system,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #cbe5df;border-radius:20px;overflow:hidden;">

      <tr><td style="padding:26px 34px 20px 34px;border-bottom:1px solid #d6ece7;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="vertical-align:middle;">
            <table role="presentation" cellpadding="0" cellspacing="0"><tr><td
              style="width:46px;height:46px;background:#0fa79a;border-radius:16px;color:#ffffff;font-size:20px;font-weight:800;text-align:center;line-height:46px;font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;">{{brand_initial}}</td></tr></table>
          </td>
          <td style="vertical-align:middle;padding-left:13px;">
            <div style="font-size:18px;font-weight:800;color:#10201d;">{{from_name}}</div>
            <div style="font-size:11.5px;font-weight:700;color:#0c8579;letter-spacing:0.04em;text-transform:uppercase;margin-top:2px;">{{tagline}}</div>
          </td>
        </tr></table>
      </td></tr>

      <tr><td style="padding:30px 34px 8px 34px;">
        <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.25;font-weight:800;color:#10201d;">{{heading}}</h1>
        <p style="margin:0 0 22px 0;font-size:14px;line-height:1.65;color:#5c7b75;">{{intro}}</p>
      </td></tr>

      <tr><td style="padding:0 34px 8px 34px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          {{{details}}}
        </table>
      </td></tr>

      <tr><td style="padding:26px 34px 30px 34px;">
        <div style="background:#e6f4f1;border-left:3px solid #0fa79a;border-radius:0 12px 12px 0;padding:12px 15px;font-size:12.5px;color:#0c5a52;line-height:1.6;">
          Kérdésed van, vagy módosítanál az időponton? Egyszerűen válaszolj erre az e-mailre — örömmel segítünk. 🙂
        </div>
      </td></tr>

    </table>

    <div style="max-width:600px;margin:16px auto 0 auto;text-align:center;font-size:11px;color:#7c9c95;font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;">
      Ezt az e-mailt a <strong style="color:#0c8579;">Slot<span style="color:#0c8579;">li</span></strong> küldte a weboldalad időpontfoglalója alapján.
    </div>

  </td></tr>
</table>
</div>
